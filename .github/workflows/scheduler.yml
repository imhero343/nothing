name: Telegram scheduled posts

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Telegram Serverless project
        run: |
          mkdir tgcloud-project
          cd tgcloud-project
          npx --yes @tgcloud/cli init --no-git
          npx --yes @tgcloud/cli pull

      - name: Run due schedules
        working-directory: tgcloud-project
        run: |
          npx --yes @tgcloud/cli run endpoints/runScheduled '{}' --ctx '{initData:{user:{id:270588872}}}'
